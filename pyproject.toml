[project]
name = "mmdoc"
version = "0.1.2"
description = "A folder-based multimodal document format and CLI for AI-native research"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = [
    "multimodal",
    "markdown",
    "documents",
    "ai-agents",
    "images",
    "docx",
    "google-docs",
    "clipboard",
    "pandoc",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "typer>=0.12",
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://github.com/hsurick/mmdoc"
Repository = "https://github.com/hsurick/mmdoc"

[project.scripts]
mmdoc = "mmdoc.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mmdoc"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
